# Requirement: PN-RND-005
# Decision:    ADR-0004, ADR-0005, ADR-0006, ADR-0009

[package]
name = "pn-render-graph"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Pass DAG, culling, lifetime analysis, and barrier derivation over declared resource intents"

[dependencies]
pn-rhi = { path = "../pn-rhi" }

[dev-dependencies]
# Test-only. The graph does not depend on a backend; its tests validate the
# graph's output against one, which is a different relationship and the only
# one that makes the end-to-end check possible.
pn-rhi-reference = { path = "../pn-rhi-reference" }
